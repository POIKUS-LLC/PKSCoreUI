name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: xcodebuild test -scheme PKSCoreUI-Package -destination 'platform=iOS Simulator,name=iPhone 16'
